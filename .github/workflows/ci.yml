name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          pip install -e .[dev]
      - name: Unit tests
        run: |
          python -m pytest tests/ -q
      - name: Smoke (compress demo log)
        run: |
          python -c "
          from common.log_compressor import build_analysis_view
          log = ['2026-01-01 00:00:%02d [svc] %s' % (i%60, 'ERROR boom' if i%7==0 else 'INFO ok') for i in range(200)]
          view = build_analysis_view(log)
          assert '[服务级错误分布]' in view and len(view) < 5000
          print('smoke OK:', len(view), 'chars')
          "
